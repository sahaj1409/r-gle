<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- FIX: Removed user-scalable=no and maximum-scale=1.0 to preserve native zoom accessibility. 
       Auto-zoom is prevented via CSS (font-size: 16px on inputs). -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Cycle Tracker</title>

  <!-- PWA ADDITIONS: Apple Touch Icons & App Shell Config -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="placeholder-icon.png">
  <link rel="apple-touch-startup-image" href="placeholder-splash.png">
  <meta name="theme-color" content="#000000">

  <style>
    /* FIX: @property definition allows CSS variables to be natively animated in WebKit */
    @property --accent {
      syntax: '<color>';
      initial-value: #FF2D55;
      inherits: true;
    }

    :root {
      --bg: #000000;
      --surface: #1C1C1E;
      --surface-hover: #2C2C2E;
      --accent: #FF2D55;
      --text: #FFFFFF;
      /* FIX: Lightened subtext from #8E8E93 to #A1A1A6 to pass WCAG AA contrast against black */
      --subtext: #A1A1A6; 
      --border: #38383A;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      /* FIX: 100dvh prevents UI clipping from Safari's dynamic bottom toolbar */
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: env(safe-area-inset-top, 20px) 20px 15px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
    }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      padding-bottom: env(safe-area-inset-bottom, 20px);
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Accessibility Semantic Adjustments */
    button {
      background: none;
      border: none;
      color: inherit;
      font: inherit;
      cursor: pointer;
      padding: 0;
    }

    .btn-primary {
      background-color: var(--accent);
      color: #FFF;
      padding: 14px;
      border-radius: 12px;
      font-weight: 600;
      width: 100%;
      text-align: center;
      transition: --accent 0.5s ease, transform 0.1s ease;
    }

    .btn-primary:active {
      transform: scale(0.97);
    }

    .section-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--text);
    }

    /* Calendar Grid */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }

    /* FIX: Changed calendar items from <div> to <button> for VoiceOver navigation */
    .calendar-day {
      aspect-ratio: 1;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 500;
      background-color: var(--surface);
      color: var(--text);
    }
    
    .calendar-day.flow {
      background-color: var(--accent);
      color: #FFF;
    }

    /* SVG Chart */
    .chart-container {
      background: var(--surface);
      border-radius: 16px;
      padding: 16px;
      height: 200px;
      display: flex;
      align-items: flex-end;
    }

    svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* Drawer/Layer */
    .drawer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: var(--surface);
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 24px;
      padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
      z-index: 100;
      box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
    }

    .drawer.open {
      transform: translateY(0);
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: var(--subtext);
    }

    /* FIX: font-size 16px minimum prevents iOS Safari from automatically zooming in */
    input, select, textarea {
      width: 100%;
      font-size: 16px; 
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px;
      border-radius: 10px;
      appearance: none;
    }

    /* Vault List */
    .vault-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .vault-item {
      background: var(--surface);
      padding: 16px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>Cycle Tracker</h1>
    <button id="addLogBtn" class="btn-primary" style="width: auto; padding: 8px 16px;" aria-label="Add new log">
      + Log
    </button>
  </header>

  <main>
    <section>
      <div class="section-title">Calendar</div>
      <div id="calendar-container" class="calendar-grid"></div>
    </section>

    <section>
      <div class="section-title">BBT Chart</div>
      <div id="chart-container" class="chart-container" aria-label="Basal Body Temperature Chart" role="img"></div>
    </section>

    <section>
      <div class="section-title">Log Vault</div>
      <div id="vault-container" class="vault-list"></div>
    </section>
  </main>

  <!-- Logging Drawer -->
  <!-- FIX: aria-hidden updates logically for screen readers -->
  <div id="layer" class="drawer" aria-hidden="true" role="dialog" aria-labelledby="drawer-title">
    <div class="drawer-header">
      <h2 id="drawer-title" style="margin: 0; font-size: 20px;">Daily Log</h2>
      <button id="closeLayerBtn" aria-label="Close dialog" style="color: var(--subtext); font-size: 24px;">&times;</button>
    </div>

    <!-- FIX: Properly linked <label> attributes for all inputs -->
    <div class="form-group">
      <label for="logDate">Date</label>
      <input type="date" id="logDate">
    </div>

    <div class="form-group">
      <label for="flowSelect">Flow Level</label>
      <select id="flowSelect">
        <option value="None">None</option>
        <option value="Light">Light</option>
        <option value="Medium">Medium</option>
        <option value="Heavy">Heavy</option>
      </select>
    </div>

    <div class="form-group">
      <label for="bbtInput">Basal Body Temp (°F)</label>
      <input type="number" id="bbtInput" step="0.01" placeholder="e.g. 97.60">
    </div>

    <button id="saveBtn" class="btn-primary">Save Entry</button>
  </div>

  <script>
    /* ==============================
       STATE MANAGEMENT
       ============================== */
    const appState = {
      logs: [
        { date: '2023-10-01', flow: 'Medium', bbt: 97.5 },
        { date: '2023-10-02', flow: 'Heavy', bbt: 97.4 },
        { date: '2023-10-03', flow: 'Medium', bbt: null },
        { date: '2023-10-06', flow: 'Light', bbt: 97.6 }, // Deliberate gap to test engine logic
        { date: '2023-10-14', flow: 'None', bbt: 98.2 }
      ]
    };

    /* ==============================
       FIX: CRITICAL JS BUGS
       ============================== */

    // 1. UTC Date Shift Fix
    // Safely parses "YYYY-MM-DD" into a local time Date object without off-by-one errors.
    function parseLocal(dateStr) {
      if (!dateStr) return new Date();
      const [year, month, day] = dateStr.split('-');
      return new Date(parseInt(year, 10), parseInt(month, 10) - 1, parseInt(day, 10));
    }

    // 2. Engine Calculation Flaws
    function engineCalculate() {
      // FIX: Ascending chronological sort exclusively for calculation (separated from UI sort)
      const sortedForMath = [...appState.logs].sort((a, b) => parseLocal(a.date) - parseLocal(b.date));
      
      let cycles = [];
      let currentCycle = null;

      sortedForMath.forEach((log) => {
        if (log.flow && log.flow !== 'None') {
          const logDate = parseLocal(log.date);
          
          if (!currentCycle) {
            currentCycle = { start: logDate, logs: [log] };
          } else {
            // FIX: Actual day difference logic. Previously, missed days caused an arbitrary 
            // 5-day cycle split. We now calculate true distance. (Assuming flows <= 7 days apart are same cycle).
            const lastLogDate = parseLocal(currentCycle.logs[currentCycle.logs.length - 1].date);
            const diffDays = (logDate - lastLogDate) / (1000 * 60 * 60 * 24);
            
            if (diffDays > 7) {
              cycles.push(currentCycle);
              currentCycle = { start: logDate, logs: [log] };
            } else {
              currentCycle.logs.push(log);
            }
          }
        }
      });
      if (currentCycle) cycles.push(currentCycle);
      
      console.log("Calculated Cycles:", cycles);
      return cycles;
    }

    /* ==============================
       UI RENDERING
       ============================== */

    // 3. DOM Thrashing Fix (Calendar)
    function renderCalendar() {
      const container = document.getElementById('calendar-container');
      const flowDates = new Set(
        appState.logs.filter(l => l.flow && l.flow !== 'None').map(l => l.date)
      );
      
      // FIX: Use a string builder to compile the entire DOM update in memory first
      let htmlString = '';
      
      // Generating a mock 31-day month for UI purposes
      for (let i = 1; i <= 31; i++) {
        const dateStr = `2023-10-${i.toString().padStart(2, '0')}`;
        const isFlow = flowDates.has(dateStr);
        // FIX: Using semantic <button> for interactive days
        htmlString += `<button class="calendar-day ${isFlow ? 'flow' : ''}" aria-label="October ${i}">${i}</button>`;
      }
      
      // One-time DOM insertion
      container.innerHTML = htmlString;
    }

    // 4. SVG NaN Crash Fix (Chart)
    function renderBBTChart() {
      const container = document.getElementById('chart-container');
      
      // FIX: Strictly filter out null, undefined, or NaN values before math operations
      const validLogs = appState.logs.filter(l => l.bbt != null && !isNaN(parseFloat(l.bbt)));
      
      if (validLogs.length < 2) {
        container.innerHTML = '<div style="color: var(--subtext); margin: auto;">Not enough data points</div>';
        return;
      }

      validLogs.sort((a, b) => parseLocal(a.date) - parseLocal(b.date));
      
      const bbtValues = validLogs.map(l => l.bbt);
      const minBBT = Math.min(...bbtValues) - 0.2;
      const maxBBT = Math.max(...bbtValues) + 0.2;
      const range = maxBBT - minBBT || 1;

      let points = validLogs.map((log, index) => {
        const x = (index / (validLogs.length - 1)) * 100;
        const y = 100 - (((log.bbt - minBBT) / range) * 100);
        return `${x},${y}`;
      }).join(' ');

      // Safe SVG injection without NaN corruption
      container.innerHTML = `
        <svg viewBox="0 0 100 100" preserveAspectRatio="none">
          <polyline points="${points}" fill="none" stroke="var(--accent)" stroke-width="3" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
          ${validLogs.map((log, index) => {
             const x = (index / (validLogs.length - 1)) * 100;
             const y = 100 - (((log.bbt - minBBT) / range) * 100);
             return `<circle cx="${x}" cy="${y}" r="2" fill="var(--bg)" stroke="var(--accent)" stroke-width="1.5" vector-effect="non-scaling-stroke"/>`;
          }).join('')}
        </svg>
      `;
    }

    // 5. DOM Thrashing Fix (Vault)
    function renderVault() {
      const container = document.getElementById('vault-container');
      
      // FIX: Descending sort applied only for UI presentation, leaving math logic untouched
      const sortedForUI = [...appState.logs].sort((a, b) => parseLocal(b.date) - parseLocal(a.date));
      
      let htmlString = '';
      sortedForUI.forEach(log => {
        htmlString += `
          <div class="vault-item">
            <div>
              <strong>${log.date}</strong>
              <div style="font-size: 14px; color: var(--subtext); margin-top: 4px;">Flow: ${log.flow}</div>
            </div>
            <div style="font-size: 18px; font-weight: 600;">
              ${log.bbt ? log.bbt + '°' : '--'}
            </div>
          </div>
        `;
      });
      container.innerHTML = htmlString;
    }

    /* ==============================
       EVENT LISTENERS & MEMORY FIXES
       ============================== */
    
    const layer = document.getElementById('layer');
    const logDateInput = document.getElementById('logDate');
    const flowSelect = document.getElementById('flowSelect');
    const bbtInput = document.getElementById('bbtInput');

    function openLayer() {
      layer.classList.add('open');
      layer.setAttribute('aria-hidden', 'false');
      
      // Pre-fill with today's local date properly formatted
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      logDateInput.value = `${yyyy}-${mm}-${dd}`;
    }

    function closeLayer() {
      layer.classList.remove('open');
      layer.setAttribute('aria-hidden', 'true');
    }

    // FIX: Bound statically outside of openLayer() to prevent duplicate binding memory leaks
    logDateInput.addEventListener('change', (e) => {
      console.log("Date changed to:", e.target.value);
      // Future logic: hydrate form with existing data if selected date was already logged
    });

    document.getElementById('addLogBtn').addEventListener('click', openLayer);
    document.getElementById('closeLayerBtn').addEventListener('click', closeLayer);
    
    document.getElementById('saveBtn').addEventListener('click', () => {
      appState.logs.push({
        date: logDateInput.value,
        flow: flowSelect.value,
        bbt: bbtInput.value ? parseFloat(bbtInput.value) : null
      });
      
      closeLayer();
      renderAll();
    });

    function renderAll() {
      engineCalculate();
      renderCalendar();
      renderBBTChart();
      renderVault();
    }

    // Initialize App
    renderAll();

    /* ==============================
       INLINE SERVICE WORKER (PWA)
       ============================== */
    // FIX: Dynamically creates and registers a Service Worker to cache the App Shell for offline use.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swCode = `
          const CACHE_NAME = 'cycle-tracker-v1';
          self.addEventListener('install', event => {
            self.skipWaiting();
            event.waitUntil(caches.open(CACHE_NAME).then(cache => cache.addAll(['/'])));
          });
          self.addEventListener('activate', event => {
            event.waitUntil(self.clients.claim());
          });
          self.addEventListener('fetch', event => {
            event.respondWith(
              caches.match(event.request).then(response => {
                return response || fetch(event.request);
              })
            );
          });
        `;
        
        const blob = new Blob([swCode], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(blob);
        
        navigator.serviceWorker.register(swUrl).then(registration => {
          console.log('Inline ServiceWorker registered successfully:', registration.scope);
        }).catch(err => {
          console.error('ServiceWorker registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
